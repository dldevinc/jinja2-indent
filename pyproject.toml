[project]
name = "jinja2-indent"
version = "1.0.0b1"
description = "A Jinja2 extension for managing indentation in templates."
requires-python = ">=3.10"
dependencies = [
    "jinja2 (>=3.1.0)",
    "jinja2-simple-tags (>=0.6.0,<1.0.0)",
]
authors = [
    { name = "Mihail Mishakin", email = "x896321475@gmail.com" }
]
maintainers = [
    { name = "Mihail Mishakin", email = "x896321475@gmail.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["classifiers"]

[project.urls]
repository = "https://github.com/dldevinc/jinja2-indent"

[tool.poetry]
requires-poetry = ">=2.0"
classifiers = [
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
packages = [
    { include = "jinja2_indent" },
]

[tool.poetry.group.pytest]
optional = true

[tool.poetry.group.pytest.dependencies]
pytest = ">=9.0"
pytest-cov = ">=4.0"
pytest-xdist = ">=3.7"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "vendor",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
lines-between-types = 1
lines-after-imports = 2
known-first-party = ["jinja2_indent"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]


[tool.pytest]
minversion = "9.0"
addopts = [ "-n", "logical", "-ra" ]
testpaths = ["tests"]

[tool.coverage.run]
source = [
    "jinja2_indent",
]
omit = [
    "*/tests/*",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
